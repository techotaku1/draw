  <line x1="200" y1="96" x2="200" y2="140" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round"/>
  <ellipse cx="200" cy="55" rx="36" ry="45" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>

  <circle cx="118" cy="352" r="12" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <circle cx="296" cy="342" r="12" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
</svg>
